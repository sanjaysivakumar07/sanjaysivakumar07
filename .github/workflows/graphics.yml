name: GitHub Profile Automated Graphics Engine

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-3d-contrib:
    name: Generate 3D Isometric Contribution Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Isometric SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: sanjaysivakumar07

      - name: Commit & Push 3D Contributions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || git commit -m "chore(graphics): render 3d isometric contribution matrix"
          git pull --rebase origin main
          git push origin main

  generate-snake-animation:
    name: Generate Dynamic Contribution Snake Animation
    runs-on: ubuntu-latest
    needs: generate-3d-contrib
    steps:
      - name: Render Animated Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: sanjaysivakumar07
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#161b22,#0d4429,#006d32,#26a641,#00f2fe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
